on:
  workflow_dispatch:

  schedule:
    - cron: "2,17,32,47 6-21 * * *"
      timezone: "Asia/Taipei"

    - cron: "2 22 * * *"
      timezone: "Asia/Taipei"
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Cron: ${{ github.event.schedule }}"
          echo "Taipei time:"
          TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S'
